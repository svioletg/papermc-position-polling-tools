[project]
name = "papermc-position-polling-tools"
description = "Tools (primarily visualizations) for the PositionPolling Minecraft server plugin."
authors = [
    { name = "Seth 'Violet' Gibbs" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "py-geometry-utils>=0.6.0",
    "py-maybetype>=0.14.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ipython>=9.16.1",
    "notebook>=7.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "positionpolling/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["positionpolling"]

[project.scripts]
positionpolling = "positionpolling.cli:main"
