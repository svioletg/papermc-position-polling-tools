name: Build project

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & test project on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest', 'macos-latest' ]
        python-version:
          - 3.12
          - 3.13
          - 3.14

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
    - name: Install project
      run: |
        python -m pip install --upgrade pip
        pip install .
    #- name: Run
    #  run: (main project command)
    - name: Install extras
      run: pip install .[all]
    - name: Test
      run: |
        pytest -v --doctest-modules
